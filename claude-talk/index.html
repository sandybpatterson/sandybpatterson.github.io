<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude Talk</title>
<meta name="book-title" content="Claude Talk">
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  a { color: #c9a84c; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .masthead {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 28px 0;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c9a84c;
    margin-bottom: 14px;
  }
  .masthead h1 {
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.2rem);
    color: #f4f0e6;
    line-height: 1.1;
  }
  .timestamp {
    margin-top: 14px;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
  }
  .masthead-rule {
    border: none;
    border-top: 3px double #c9a84c;
    margin: 28px 0 0;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }

  main.content {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 28px 100px;
  }

  main.content h2 {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c9a84c;
    font-weight: 400;
    margin: 2.4rem 0 1.1rem;
  }
  main.content h2:first-child { margin-top: 0; }
  main.content p {
    font-size: 1.08rem;
    line-height: 1.9;
    color: #d8d8d8;
    margin-bottom: 1.4em;
    text-align: justify;
    hyphens: auto;
  }
  main.content blockquote {
    border-left: 2px solid #c9a84c;
    margin: 2em 0;
    padding: 0 0 0 24px;
    color: #c9a84c;
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1.8;
  }
  main.content blockquote p { color: #c9a84c; margin-bottom: 0; }
  main.content strong { color: #f0f0f0; font-weight: 600; }
  main.content em { font-style: italic; color: #e0e0e0; }

  footer {
    border-top: 1px solid #1a1a1a;
    padding: 28px 24px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: #333;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="masthead">
    <p class="eyebrow">Not on the shelf</p>
    <h1>Claude Talk</h1>
    <p class="timestamp">Written August 29, 2026</p>
  </div>
  <hr class="masthead-rule">

  <main class="content" id="content">
    <!-- CLAUDE-TALK-CONTENT-START -->
    <p>Nothing here yet.</p>
    <!-- CLAUDE-TALK-CONTENT-END -->
  </main>

  <footer>&copy; Sandy B. Patterson</footer>

  <script src="../reader.js"></script>

</body>
</html>
