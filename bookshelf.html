<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandy B. Patterson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    a { color: #c9a84c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e1e;
    }
    .nav-brand {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c9a84c;
    }

    .hero {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 28px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .eyebrow {
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero .subtitle {
      font-size: 1.15rem;
      color: #888;
      font-style: italic;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 40px 0;
    }

    /* ───────────────────────────────────────────
       SHELF
       Cover colors stay hardcoded — always dark
       for the book aesthetic.
    ─────────────────────────────────────────── */

    .shelf-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 28px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sbp-shelf {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
    }
    .sbp-shelf-floor {
      width: 100%;
      max-width: 600px;
      height: 1px;
      background: linear-gradient(to right, transparent, #1e1e1e 20%, #1e1e1e 80%, transparent);
    }
    .sbp-shelf-shadow {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), transparent);
      margin-bottom: 2rem;
    }

    .sbp-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .sbp-cover {
      container-type: inline-size;
      width: clamp(190px, 46vw, 400px);
      aspect-ratio: 5 / 7;
      background: linear-gradient(145deg, #1a1712, #0a0806);
      border-radius: 4px 14px 14px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7cqw 5cqw;
      position: relative;
      box-shadow: 3px 3px 0px #0a0806, 6px 6px 0px #130f09, 10px 14px 30px rgba(0,0,0,0.45), 14px 20px 50px rgba(0,0,0,0.25);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .sbp-book:hover .sbp-cover {
      transform: translateY(-14px) rotate(-0.5deg);
      box-shadow: 3px 3px 0px #0a0806, 6px 6px 0px #130f09, 14px 28px 44px rgba(0,0,0,0.5), 18px 36px 64px rgba(0,0,0,0.3);
    }
    .sbp-book:hover .sbp-label { color: #c9a84c; border-color: #c9a84c; }

    .sbp-cover::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 7cqw;
      background: rgba(255,255,255,0.05);
      border-radius: 4px 0 0 4px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .sbp-cover::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 2cqw;
      background: rgba(0,0,0,0.3);
      border-radius: 0 14px 14px 0;
    }

    .sbp-cover-title {
      font-size: clamp(0.95rem, 6.2cqw, 1.56rem);
      font-weight: 700;
      color: #f0e8d8;
      text-align: center;
      letter-spacing: 0.06em;
      line-height: 1.55;
      position: relative;
      z-index: 1;
    }
    .sbp-cover-ornament { color: #c9a84c; font-size: clamp(1rem, 7.2cqw, 1.8rem); margin: clamp(0.8rem, 5.6cqw, 1.4rem) 0; letter-spacing: 0.35em; }
    .sbp-cover-author {
      font-style: italic;
      font-size: clamp(0.8rem, 5.6cqw, 1.4rem);
      color: #c9a84c;
      text-align: center;
      position: absolute;
      bottom: clamp(0.8rem, 5cqw, 2rem);
      letter-spacing: 0.02em;
    }

    .sbp-label {
      margin-top: 0.9rem;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #888;
      text-align: center;
      text-transform: uppercase;
      padding: 5px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      transition: color 0.15s, border-color 0.15s;
    }

    .sbp-img-cover { background: none !important; padding: 0 !important; overflow: hidden; }
    .sbp-img-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px 14px 14px 4px;
      display: block;
    }

    /* ───────────────────────────────────────────
       LINK TREE
    ─────────────────────────────────────────── */

    .link-tree {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 28px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: block;
      text-align: center;
      padding: 16px 24px;
      border: 1px solid #c9a84c;
      border-radius: 999px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c9a84c;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .link-btn:hover {
      background: #c9a84c;
      color: #0a0a0a;
      text-decoration: none;
    }

    footer {
      border-top: 1px solid #1a1a1a;
      padding: 28px 24px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Sandy B. Patterson</span>
  </nav>

  <div class="hero">
    <p class="eyebrow">Author</p>
    <h1>Sandy B. Patterson</h1>
    <p class="subtitle">Short Stories &amp; Novels</p>
    <div class="divider"></div>
  </div>

  <div class="shelf-wrap">
    <div class="sbp-shelf">
      <a href="https://sandybpatterson.github.io/original-bug-book/" class="sbp-book">
        <div class="sbp-cover sbp-img-cover">
          <img src="/images/tobcover.png" alt="The Original Bug" />
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/beyond-ice-and-steam/" class="sbp-book">
        <div class="sbp-cover sbp-img-cover">
          <img src="/images/biascover.png" alt="Beyond Ice and Steam" style="object-position: top;" />
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/dead-men-on-thrones/" class="sbp-book">
        <div class="sbp-cover sbp-img-cover">
          <img src="/images/dmotcover.jpeg" alt="Dead Men on Thrones" />
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/stories/" class="sbp-book">
        <div class="sbp-cover">
          <div class="sbp-cover-title">Stories from Winchester</div>
          <div class="sbp-cover-ornament">✦</div>
          <div class="sbp-cover-author">Sandy B. Patterson</div>
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/arden-remembers/" class="sbp-book">
        <div class="sbp-cover">
          <div class="sbp-cover-title">Arden Remembers</div>
          <div class="sbp-cover-ornament">✦</div>
          <div class="sbp-cover-author">Sandy B. Patterson</div>
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
    </div>
    <div class="sbp-shelf-floor"></div>
    <div class="sbp-shelf-shadow"></div>
  </div>

  <div class="link-tree">
    <a href="https://sandybpatterson.github.io/ai-tools-directory/" class="link-btn">AI Tools</a>
    <a href="https://sandybpatterson.substack.com" class="link-btn" target="_blank" rel="noopener noreferrer">Substack</a>
    <a href="more.html" class="link-btn">More</a>
  </div>

  <footer>&copy; Sandy B. Patterson</footer>

</body>
</html>
