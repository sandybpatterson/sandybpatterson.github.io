<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandy B. Patterson</title>
  <script>
    (function () {
      const saved = localStorage.getItem('colorMode');
      if (saved) document.documentElement.classList.add(saved);
      else document.documentElement.classList.add('dark');
    })();
  </script>
  <style>

    /* ───────────────────────────────────────────
       CSS VARIABLE SYSTEM
    ─────────────────────────────────────────── */

    :root {
      --bg:           #f7f2ea;
      --heading:      #1e1810;
      --muted:        #7a6448;
      --border:       #c4ae8a;
      --accent:       #a8823c;
      --label:        #9a7d55;
      --label-hover:  #6a4e2a;
      --toggle-color: #8a7355;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0a0a0a;
        --heading:      #f0f0f0;
        --muted:        #888;
        --border:       #1e1e1e;
        --accent:       #c9a84c;
        --label:        #888;
        --label-hover:  #c9a84c;
        --toggle-color: #888;
      }
    }

    html.dark {
      --bg:           #0a0a0a;
      --heading:      #f0f0f0;
      --muted:        #888;
      --border:       #1e1e1e;
      --accent:       #c9a84c;
      --label:        #888;
      --label-hover:  #c9a84c;
      --toggle-color: #888;
    }

    html.light {
      --bg:           #f7f2ea;
      --heading:      #1e1810;
      --muted:        #7a6448;
      --border:       #c4ae8a;
      --accent:       #a8823c;
      --label:        #9a7d55;
      --label-hover:  #6a4e2a;
      --toggle-color: #8a7355;
    }

    /* ───────────────────────────────────────────
       RESET & BASE
    ─────────────────────────────────────────── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--heading);
      font-family: Georgia, 'Times New Roman', serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    a { color: var(--accent); }

    /* ───────────────────────────────────────────
       NAV
    ─────────────────────────────────────────── */

    .top-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .nav-brand {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .moon-toggle {
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--toggle-color);
      background: none;
      border: none;
      line-height: 1;
      padding: 0.2rem;
      transition: color 0.3s ease;
    }
    .moon-toggle:hover { color: var(--accent); }

    /* ───────────────────────────────────────────
       PAGE WRAP
    ─────────────────────────────────────────── */

    .sbp-wrap {
      background: var(--bg);
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem 0;
      transition: background-color 0.3s ease;
    }

    /* ───────────────────────────────────────────
       HEADER
    ─────────────────────────────────────────── */

    .eyebrow {
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      transition: color 0.3s ease;
    }

    .sbp-name {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--heading);
      text-align: center;
      margin-bottom: 0.5rem;
      line-height: 1.1;
      transition: color 0.3s ease;
    }

    .sbp-subtitle {
      font-style: italic;
      font-size: 1.05rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2.5rem;
      transition: color 0.3s ease;
    }

    /* ───────────────────────────────────────────
       DECORATIVE RULE
    ─────────────────────────────────────────── */

    .divider {
      width: 60px;
      height: 1px;
      background: var(--accent);
      margin-bottom: 3rem;
      transition: background-color 0.3s ease;
    }

    /* ───────────────────────────────────────────
       SHELF
    ─────────────────────────────────────────── */

    .sbp-shelf {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
    }
    .sbp-shelf-floor {
      width: 100%;
      max-width: 600px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border) 20%, var(--border) 80%, transparent);
    }
    .sbp-shelf-shadow {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), transparent);
      margin-bottom: 2rem;
    }

    /* ───────────────────────────────────────────
       BOOK COVERS
       Cover colors stay hardcoded — always dark
       for the book aesthetic regardless of mode.
    ─────────────────────────────────────────── */

    .sbp-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .sbp-cover {
      width: 200px;
      height: 280px;
      background: linear-gradient(145deg, #1a1712, #0a0806);
      border-radius: 2px 7px 7px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.4rem 1rem;
      position: relative;
      box-shadow: 2px 2px 0px #0a0806, 4px 4px 0px #130f09, 6px 8px 18px rgba(0,0,0,0.45), 8px 12px 30px rgba(0,0,0,0.25);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .sbp-book:hover .sbp-cover {
      transform: translateY(-10px) rotate(-0.5deg);
      box-shadow: 2px 2px 0px #0a0806, 4px 4px 0px #130f09, 8px 18px 28px rgba(0,0,0,0.5), 12px 24px 40px rgba(0,0,0,0.3);
    }
    .sbp-book:hover .sbp-label { color: var(--accent); border-color: var(--accent); }

    .sbp-cover::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px 0 0 2px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .sbp-cover::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 4px;
      background: rgba(0,0,0,0.3);
      border-radius: 0 7px 7px 0;
    }

    .sbp-cover-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f0e8d8;
      text-align: center;
      letter-spacing: 0.06em;
      line-height: 1.55;
      position: relative;
      z-index: 1;
    }
    .sbp-cover-ornament { color: #c9a84c; font-size: 0.9rem; margin: 0.7rem 0; letter-spacing: 0.35em; }
    .sbp-cover-author {
      font-style: italic;
      font-size: 0.7rem;
      color: #c9a84c;
      text-align: center;
      position: absolute;
      bottom: 1rem;
      letter-spacing: 0.02em;
    }

    .sbp-label {
      margin-top: 0.9rem;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--label);
      text-align: center;
      text-transform: uppercase;
      padding: 5px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .sbp-img-cover { background: none !important; padding: 0 !important; overflow: hidden; }
    .sbp-img-cover img {
      width: 200px;
      height: 280px;
      object-fit: cover;
      border-radius: 2px 7px 7px 2px;
      display: block;
    }

    /* ───────────────────────────────────────────
       FOOTER
    ─────────────────────────────────────────── */

    .site-footer {
      border-top: 1px solid var(--border);
      margin-top: 4rem;
      padding: 28px 24px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      transition: border-color 0.3s ease, color 0.3s ease;
    }

  </style>
</head>
<body>
  <nav class="top-nav">
    <span class="nav-brand">Sandy B. Patterson</span>
    <button class="moon-toggle" onclick="toggleMode()" title="Toggle dark mode">&#9790;</button>
  </nav>

  <div class="sbp-wrap">
    <p class="eyebrow">Author</p>
    <div class="sbp-name">Sandy B. Patterson</div>
    <div class="sbp-subtitle">Short Stories &amp; Novels</div>
    <div class="divider"></div>
    <div class="sbp-shelf">
      <a href="https://sandybpatterson.github.io/stories/" class="sbp-book">
        <div class="sbp-cover">
          <div class="sbp-cover-title">Stories from Winchester</div>
          <div class="sbp-cover-ornament">✦</div>
          <div class="sbp-cover-author">Sandy B. Patterson</div>
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/original-bug-book/" class="sbp-book">
        <div class="sbp-cover sbp-img-cover">
          <img src="/images/tobcover.png" alt="The Original Bug" />
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
      <a href="https://sandybpatterson.github.io/beyond-ice-and-steam/" class="sbp-book">
        <div class="sbp-cover">
          <div class="sbp-cover-title">Beyond Ice and Steam</div>
          <div class="sbp-cover-ornament">✦</div>
          <div class="sbp-cover-author">Sandy B. Patterson</div>
        </div>
        <div class="sbp-label">Read Now</div>
      </a>
    </div>
    <div class="sbp-shelf-floor"></div>
    <div class="sbp-shelf-shadow"></div>
  </div>

  <footer class="site-footer">&copy; Sandy B. Patterson</footer>

  <script>
    function toggleMode() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      html.classList.remove('dark', 'light');
      html.classList.add(isDark ? 'light' : 'dark');
      localStorage.setItem('colorMode', isDark ? 'light' : 'dark');
    }
  </script>
</body>
</html>
