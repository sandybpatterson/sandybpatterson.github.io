<!--
  Structural template for one Claude Talk entry page.
  Copy this file's structure and CSS verbatim — don't redesign it per entry.
  Replace every {{PLACEHOLDER}}. Everything else stays exactly as written.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} — Claude Talk</title>
<meta name="book-title" content="Claude Talk">
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  a { color: #c9a84c; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .masthead-strip {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 28px 0;
    text-align: center;
  }
  .masthead-strip .name a {
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #c9a84c;
  }
  .masthead-strip hr {
    border: none;
    border-top: 3px double #c9a84c;
    margin: 14px 0 0;
  }

  .page { max-width: 680px; margin: 0 auto; padding: 36px 28px 100px; }

  .headline {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 700;
    color: #f0f0f0;
    line-height: 1.2;
    margin-bottom: 14px;
  }
  .byline {
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 32px;
  }

  hr.divider { border: none; border-top: 1px solid #1e1e1e; margin: 0 0 32px; }

  .content h2 {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c9a84c;
    font-weight: 400;
    margin: 2.4rem 0 1.1rem;
  }
  .content h2:first-child { margin-top: 0; }
  .content p {
    font-size: 1.08rem;
    line-height: 1.9;
    color: #d8d8d8;
    margin-bottom: 1.4em;
    text-align: justify;
    hyphens: auto;
  }
  .content blockquote {
    border-left: 2px solid #c9a84c;
    margin: 2em 0;
    padding: 0 0 0 24px;
    color: #c9a84c;
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1.8;
  }
  .content blockquote p { color: #c9a84c; margin-bottom: 0; }
  .content strong { color: #f0f0f0; font-weight: 600; }
  .content em { font-style: italic; color: #e0e0e0; }

  footer {
    border-top: 1px solid #1a1a1a;
    padding: 28px 24px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: #333;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="masthead-strip">
    <div class="name"><a href="index.html">Claude Talk</a></div>
    <hr>
  </div>

  <div class="page">

    <h1 class="headline">{{TITLE}}</h1>
    <p class="byline">Written {{MONTH_DAY_YEAR}}</p>

    <hr class="divider">

    <main class="content" id="content">
      {{BODY}}
    </main>

  </div>

  <footer>&copy; Sandy B. Patterson</footer>

  <script src="../reader.js"></script>

</body>
</html>
