<!--
  Structural template for a Wetwear Deep Dive page.
  Copy this file's structure and CSS verbatim — don't redesign it. Deep Dives share
  the Daily Brief's visual system exactly; only the content shape differs.

  Replace every {{PLACEHOLDER}} with real content. Everything else — tags, classes,
  the <style> block — stays exactly as written here.

  Unlike the Daily Brief, section labels here are NOT a fixed set — there's no
  "Biology / Misinformation / Public Health Data / Politics" taxonomy. Write however
  many sections the actual investigation needs, each with its own specific,
  story-tailored label (e.g. "What Changed," "What FDA's Own Scientists Said," "What
  Happens Next" — real examples from a real Deep Dive, not a template to imitate
  verbatim). The only fixed section is "Sources" at the end.

  Only the very first paragraph in the whole piece gets class="drop-cap".
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="book-title" content="Wetwear Deep Dive">
<title>{{HEADLINE}} — Wetwear Deep Dive</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.06rem;
    line-height: 1.8;
    min-height: 100vh;
  }

  a { color: #c9a84c; text-decoration: none; }
  a:hover { text-decoration: underline; }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #1e1e1e;
  }
  .nav-brand {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #c9a84c;
  }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    padding: 5px 14px;
    border: 1px solid transparent;
    border-radius: 999px;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav-links a:hover { color: #c9a84c; border-color: #c9a84c44; text-decoration: none; }

  .masthead-strip {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 28px 0;
    text-align: center;
  }
  .masthead-strip .name {
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: 0.08em;
    color: #f4f0e6;
  }
  .masthead-strip hr {
    border: none;
    border-top: 3px double #c9a84c;
    margin: 12px 0 0;
  }

  .page { max-width: 680px; margin: 0 auto; padding: 36px 28px 100px; }

  .headline {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 700;
    color: #f0f0f0;
    line-height: 1.15;
    text-align: center;
    margin-bottom: 14px;
  }
  .deck {
    font-style: italic;
    font-size: 1.1rem;
    color: #999;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .byline {
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888;
    text-align: center;
    margin-bottom: 32px;
  }

  hr.divider { border: none; border-top: 1px solid #1e1e1e; margin: 32px 0; }

  .section-label {
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #c9a84c;
    border-top: 1px solid #1e1e1e;
    padding-top: 1.8rem;
    margin: 2.4rem 0 1.1rem;
  }
  .section-label:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  .article-body p { margin: 0 0 1.2rem; text-align: justify; hyphens: auto; }
  .article-body p.drop-cap { text-indent: 0; }
  .article-body p.drop-cap::first-letter {
    font-family: Georgia, serif;
    font-size: 3.2rem;
    font-weight: 700;
    float: left;
    line-height: 0.8;
    margin-right: 0.08em;
    margin-top: 0.1em;
    color: #c9a84c;
  }

  .sources-list {
    list-style: none;
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    line-height: 2.1;
    color: #888;
  }
  .sources-list a { color: #a89358; }

  .closing {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #1a1a1a;
    font-style: italic;
    font-size: 0.95rem;
    color: #888;
    text-align: center;
  }
  .author {
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: #888;
    text-align: center;
    margin-top: 0.6rem;
    text-transform: uppercase;
  }

  footer {
    border-top: 1px solid #1a1a1a;
    padding: 28px 24px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: #333;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <nav>
    <span class="nav-brand"><a href="https://sandybpatterson.github.io/ai-news/" style="color:#c9a84c;">Sandy's Blog</a></span>
    <div class="nav-links">
      <a href="https://sandybpatterson.github.io/original-bug-book/">Read the Book</a>
      <a href="https://sandybpatterson.github.io/ai-tools-directory/">AI Tools</a>
      <a href="https://sandybpatterson.github.io/bookshelf.html">&larr; Bookshelf</a>
    </div>
  </nav>

  <div class="masthead-strip">
    <div class="name">Wetwear Deep Dive</div>
    <hr>
  </div>

  <article class="page">

    <h1 class="headline">{{HEADLINE}}</h1>
    <p class="deck">{{DECK}}</p>
    <p class="byline">Sandy B. Patterson &middot; {{MONTH_DAY_YEAR}}</p>

    <hr class="divider">

    <div class="article-body">

      <p class="section-label">{{FIRST_SECTION_LABEL}}</p>

      <p class="drop-cap">{{FIRST_SECTION_PARAGRAPH}}</p>

      <!-- Repeat as many <p class="section-label">…</p> + <p>…</p> blocks as the
           piece actually needs — there is no fixed count or fixed label set. -->

      <p class="section-label">Sources</p>

      <ul class="sources-list">
        <li><a href="{{URL}}">{{SOURCE NAME — Article Title}}</a></li>
        <!-- one <li> per source actually used, in the order first cited -->
      </ul>

    </div>

    <div class="closing"><em>Wetwear Deep Dive</em></div>
    <div class="author">Sandy B. Patterson</div>

  </article>

  <footer>&copy; Sandy B. Patterson</footer>

  <script src="../../reader.js"></script>

</body>
</html>
