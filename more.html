<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>More — Sandy B. Patterson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    a { color: #c9a84c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e1e;
    }
    .nav-brand {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c9a84c;
    }
    .nav-links {
      display: flex;
      gap: 8px;
    }
    .nav-links a {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      padding: 5px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-links a:hover {
      color: #c9a84c;
      border-color: #c9a84c44;
      text-decoration: none;
    }

    .hero {
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 28px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .eyebrow {
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero .subtitle {
      font-size: 1.05rem;
      color: #888;
      font-style: italic;
      line-height: 1.6;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 40px 0;
    }

    .coming-soon {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 28px 100px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #444;
    }

    footer {
      border-top: 1px solid #1a1a1a;
      padding: 28px 24px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #333;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Sandy B. Patterson</span>
    <div class="nav-links">
      <a href="https://sandybpatterson.github.io/bookshelf.html">&larr; Bookshelf</a>
    </div>
  </nav>

  <div class="hero">
    <p class="eyebrow">More</p>
    <h1>More From Sandy</h1>
    <p class="subtitle">More coming soon.</p>
    <div class="divider"></div>
  </div>

  <p class="coming-soon">Check back soon</p>

  <footer>&copy; Sandy B. Patterson</footer>

</body>
</html>
