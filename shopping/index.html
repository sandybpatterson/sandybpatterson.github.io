<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Shopping List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #e8e8e8;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.08rem; line-height: 1.75; min-height: 100vh;
    }
    a { color: #c9a84c; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 40px; background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px); border-bottom: 1px solid #1e1e1e;
    }
    .nav-brand, .nav-links a, .eyebrow, h2 {
      font-family: 'Courier New', monospace; text-transform: uppercase;
    }
    .nav-brand { font-size: 0.75rem; letter-spacing: 0.15em; color: #c9a84c; }
    .nav-links a {
      font-size: 0.72rem; letter-spacing: 0.08em; color: #888;
      padding: 5px 14px; border: 1px solid transparent; border-radius: 999px;
    }
    .nav-links a:hover { color: #c9a84c; border-color: #c9a84c44; text-decoration: none; }
    .page { max-width: 680px; margin: 0 auto; padding: 56px 28px 100px; }
    .eyebrow { font-size: 0.72rem; letter-spacing: 0.2em; color: #c9a84c; margin-bottom: 12px; }
    h1 { font-size: 2.2rem; line-height: 1.2; font-weight: normal; margin-bottom: 10px; }
    .serves { color: #999; font-style: italic; margin-bottom: 36px; }
    h2 {
      font-size: 0.8rem; letter-spacing: 0.18em; color: #c9a84c; font-weight: normal;
      border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; margin: 40px 0 18px;
    }
    ul, ol { padding-left: 1.4em; }
    li { margin-bottom: 8px; }
    li::marker { color: #c9a84c; }
    .note {
      border-left: 3px solid #c9a84c; padding: 14px 18px; background: #121212;
      margin-top: 18px;
    }
    @media (max-width: 600px) {
      nav { padding: 14px 16px; }
      .page { padding: 40px 16px 80px; }
      h1 { font-size: 1.8rem; }
    }
    @media print {
      nav { display: none; }
      body { background: #fff; color: #000; }
      .note { background: #fff; }
    }
    .add { display: flex; gap: 8px; margin: 8px 0 28px; }
    .add input {
      flex: 1; min-width: 0; font: inherit; color: #e8e8e8; background: #121212;
      border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px 12px;
    }
    .add input:focus { outline: none; border-color: #c9a84c; }
    button { font-family: 'Courier New', monospace; cursor: pointer; }
    .add button, .tools button {
      background: transparent; color: #c9a84c; border: 1px solid #c9a84c88;
      border-radius: 999px; padding: 8px 18px; font-size: 0.8rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .add button:hover, .tools button:hover { background: #c9a84c22; }
    #list { list-style: none; padding: 0; }
    #list li {
      display: flex; align-items: center; gap: 12px; margin: 0;
      padding: 10px 4px; border-bottom: 1px solid #1e1e1e;
    }
    #list input[type=checkbox] {
      width: 22px; height: 22px; flex: none; accent-color: #c9a84c; cursor: pointer;
    }
    #list label { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
    #list li.done label { text-decoration: line-through; color: #666; }
    .del {
      flex: none; width: 32px; height: 32px; border-radius: 50%;
      background: transparent; border: 1px solid transparent; color: #777; font-size: 1.1rem;
    }
    .del:hover { color: #e06c6c; border-color: #e06c6c55; }
    .count { color: #999; font-style: italic; margin-bottom: 8px; }
    .empty { color: #777; font-style: italic; padding: 16px 4px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="https://sandybpatterson.github.io/bookshelf.html">Sandy B. Patterson</a>
    <div class="nav-links">
      <a href="https://sandybpatterson.github.io/bookshelf.html">&larr; Bookshelf</a>
    </div>
  </nav>

  <main class="page">
    <p class="eyebrow">Checklist</p>
    <h1>Shopping List</h1>

    <form class="add" id="addForm" autocomplete="off">
      <input id="newItem" type="text" placeholder="Add an item&hellip;" aria-label="New item">
      <button type="submit">Add</button>
    </form>

    <p class="count" id="count"></p>
    <ul id="list"></ul>

    <div class="tools">
      <button type="button" id="clearDone">Clear checked</button>
      <button type="button" id="reset">Clear all</button>
    </div>
  </main>

  <script>
    var KEY = 'sbp-recipe-checklist';
    var DEFAULTS = [];
    var seq = 0;
    function fresh() {
      return DEFAULTS.map(function (t) { return { id: ++seq, text: t, done: false, at: 0 }; });
    }
    var items;
    try { items = JSON.parse(localStorage.getItem(KEY)); } catch (e) { items = null; }
    if (!Array.isArray(items)) items = fresh();
    items.forEach(function (i) { if (i.id > seq) seq = i.id; });

    function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }

    var listEl = document.getElementById('list');
    function render() {
      var todo = items.filter(function (i) { return !i.done; });
      var done = items.filter(function (i) { return i.done; })
                      .sort(function (a, b) { return a.at - b.at; });
      listEl.innerHTML = '';
      todo.concat(done).forEach(function (item) {
        var li = document.createElement('li');
        if (item.done) li.className = 'done';
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = 'i' + item.id; cb.checked = item.done;
        cb.addEventListener('change', function () {
          item.done = cb.checked; item.at = Date.now(); save(); render();
        });
        var label = document.createElement('label');
        label.htmlFor = cb.id; label.textContent = item.text;
        var del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.textContent = '\u00d7';
        del.setAttribute('aria-label', 'Delete ' + item.text);
        del.addEventListener('click', function () {
          items = items.filter(function (i) { return i !== item; }); save(); render();
        });
        li.appendChild(cb); li.appendChild(label); li.appendChild(del);
        listEl.appendChild(li);
      });
      if (!items.length) {
        var e = document.createElement('li');
        e.className = 'empty'; e.textContent = 'Nothing on the list. Add something above.';
        listEl.appendChild(e);
      }
      document.getElementById('count').textContent =
        items.length ? (done.length + ' of ' + items.length + ' checked off') : '';
    }

    document.getElementById('addForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var input = document.getElementById('newItem');
      var text = input.value.trim();
      if (!text) return;
      items.push({ id: ++seq, text: text, done: false, at: 0 });
      input.value = ''; save(); render(); input.focus();
    });
    document.getElementById('clearDone').addEventListener('click', function () {
      items = items.filter(function (i) { return !i.done; }); save(); render();
    });
    document.getElementById('reset').addEventListener('click', function () {
      if (items.length && confirm('Remove everything from the list?')) {
        items = fresh(); save(); render();
      }
    });
    render();
  </script>
</body>
</html>
