<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead Men on Thrones</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    a { color: #c9a84c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e1e1e;
    }
    .nav-brand {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c9a84c;
    }
    .nav-links {
      display: flex;
      gap: 8px;
    }
    .nav-links a {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      padding: 5px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-links a:hover {
      color: #c9a84c;
      border-color: #c9a84c44;
      text-decoration: none;
    }

    #content {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 28px 100px;
    }

    /* Markdown-rendered prose styles */
    #content h1 {
      font-size: 1.1rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
      font-weight: 400;
      margin-bottom: 10px;
    }
    #content h3 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.15;
      margin-bottom: 40px;
      font-family: Georgia, serif;
    }
    #content hr {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 48px 0;
    }
    #content h2 {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a84c;
      font-weight: 400;
      margin: 48px 0 24px;
    }
    #content p {
      font-size: 1.08rem;
      line-height: 1.9;
      color: #d8d8d8;
      margin-bottom: 1.6em;
    }
    #content blockquote {
      border-left: 2px solid #c9a84c;
      margin: 2em 0;
      padding: 0 0 0 24px;
      color: #c9a84c;
      font-style: italic;
      font-size: 1.1rem;
      line-height: 1.8;
    }
    #content blockquote p { color: #c9a84c; margin-bottom: 0; }
    #content strong { color: #f0f0f0; font-weight: 600; }
    #content em { font-style: italic; color: #e0e0e0; }

    /* Section divider \* \* \* */
    #content p:has(> em:only-child) {
      text-align: center;
      color: #444;
      letter-spacing: 0.3em;
      margin: 2.5em 0;
    }

    /* Footer line */
    #content > p:last-child {
      font-family: 'Courier New', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #333;
      text-transform: uppercase;
      margin-top: 60px;
      padding-top: 28px;
      border-top: 1px solid #1a1a1a;
    }

    #loading {
      max-width: 680px;
      margin: 120px auto;
      padding: 0 28px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #333;
    }

    #error-msg {
      display: none;
      max-width: 680px;
      margin: 120px auto;
      padding: 0 28px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #663333;
    }

    footer {
      border-top: 1px solid #1a1a1a;
      padding: 28px 24px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #333;
      text-transform: uppercase;
    }

    /* Chapter nav */
    .chapter-nav {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 28px 40px;
      display: flex;
      justify-content: space-between;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #444;
    }
    .chapter-nav a { color: #c9a84c; }
  </style>
</head>
<body>

  <nav>
    <span class="nav-brand"><a href="index.html" style="color:#c9a84c;">Dead Men on Thrones</a></span>
    <div class="nav-links">
      <a href="https://sandybpatterson.github.io/bookshelf.html">&larr; Bookshelf</a>
      <a href="index.html">All Chapters</a>
    </div>
  </nav>

  <div id="loading">Loading chapter…</div>
  <div id="error-msg">Chapter not found.</div>
  <div id="content" style="display:none;"></div>

  <div class="chapter-nav" id="chapter-nav" style="display:none;">
    <span id="prev-link"></span>
    <a href="index.html">↑ All Chapters</a>
    <span id="next-link"></span>
  </div>

  <footer>
    &copy; Sandy B. Patterson &mdash; Dead Men on Thrones
  </footer>

  <script>
    // Add chapters here as they're written, e.g.:
    // 1: { file: 'chapters/ch01.md', title: 'Before the Book' },
    // Special keys used by the placeholder TOC: '0' (Preface), 'i' (Introduction), 'c' (Conclusion)
    const chapters = {
      1: { file: 'chapters/ch01.md', title: 'Before the Book' },
      2: { file: 'chapters/ch02.md', title: 'The Man Who Forced the Question' },
    };

    const params = new URLSearchParams(window.location.search);
    const raw = params.get('c');
    const num = /^-?\d+$/.test(raw) ? parseInt(raw, 10) : raw;
    const chapter = chapters[num];

    function chapLabel(n) {
      if (n === '0') return 'Preface';
      if (n === 'i') return 'Introduction';
      if (n === 'c') return 'Conclusion';
      return `Ch ${n}`;
    }

    if (!chapter) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent =
        `This section hasn't been written yet. Check back soon.`;
    } else {
      document.title = `${chapter.title} — Dead Men on Thrones`;

      fetch(chapter.file)
        .then(r => {
          if (!r.ok) throw new Error('not found');
          return r.text();
        })
        .then(md => {
          document.getElementById('loading').style.display = 'none';
          const el = document.getElementById('content');
          el.innerHTML = marked.parse(md);
          el.style.display = 'block';

          // Load reader.js only after content is in the DOM — it extracts
          // paragraphs on init, so it must run after markdown is rendered.
          const readerScript = document.createElement('script');
          readerScript.src = '../reader.js';
          document.body.appendChild(readerScript);

          // Prev / next nav
          const nav = document.getElementById('chapter-nav');
          nav.style.display = 'flex';
          if (chapters[num - 1]) {
            document.getElementById('prev-link').innerHTML =
              `<a href="chapter.html?c=${num-1}">← ${chapLabel(num-1)}</a>`;
          }
          if (chapters[num + 1]) {
            document.getElementById('next-link').innerHTML =
              `<a href="chapter.html?c=${num+1}">${chapLabel(num+1)} →</a>`;
          }
        })
        .catch(() => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error-msg').style.display = 'block';
          document.getElementById('error-msg').textContent =
            `This section hasn't been written yet. Check back soon.`;
        });
    }
  </script>

</body>
</html>
